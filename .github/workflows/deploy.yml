name: Deploy Jogo da Velha

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Executar comandos na VM via SSH
        run: |
          ssh ${{ secrets.VM_USER}}@{{ secrets.VM_IP }} << 'EOF'
            cd ~/github/fe/jogo-da-velha/
            git pull
            pnpm install

            # Mata a sessão do screen se ela existir
            screen -S jogo -X quit || true

            # Cria uma nova sessão em background e roda o dev
            screen -dmS jogo pnpm run dev --host --port=5174
          EOF
