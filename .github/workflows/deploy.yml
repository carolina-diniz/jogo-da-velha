name: Deploy Jogo da Velha

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Executar comandos na VM via SSH
        env:
          VM_IP: ${{ secrets.VM_IP }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP << 'EOF'
            cd ~/github/fe/jogo-da-velha/
            git pull
            pnpm install
            screen -S jogo -X quit || true
            screen -dmS jogo pnpm run dev --host --port=5174
          EOF
